<main class="page">
  <section class="panel">
    <div class="header">
      <div>
        <h1>{{ title }}</h1>
        <p class="subtitle">Manage students from the ASP.NET Core API.</p>
      </div>
      <button class="btn ghost" type="button" (click)="loadStudents()">Reload</button>
    </div>

    <form class="form" (ngSubmit)="saveStudent()">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" [(ngModel)]="form.name" placeholder="Student name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" [(ngModel)]="form.email" placeholder="student@example.com" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" [(ngModel)]="form.phone" placeholder="+8801..." />
      </div>
      <div class="field full">
        <label for="address">Address</label>
        <input id="address" name="address" [(ngModel)]="form.address" placeholder="Address" />
      </div>

      <div class="actions">
        <button class="btn primary" type="submit">
          {{ isEditing ? 'Update Student' : 'Add Student' }}
        </button>
        <button class="btn ghost" type="button" (click)="cancelEdit()" [disabled]="!isEditing">
          Cancel
        </button>
      </div>
    </form>

    <p class="message error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="message" *ngIf="isLoading">Loading...</p>

    <div class="table-wrap" *ngIf="!isLoading">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of students">
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone || '-' }}</td>
            <td>{{ student.address || '-' }}</td>
            <td class="actions-col">
              <button class="btn small ghost" type="button" (click)="editStudent(student)">Edit</button>
              <button class="btn small danger" type="button" (click)="deleteStudent(student)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="students.length === 0">
            <td colspan="6" class="empty">No students found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<router-outlet />
